[package]
name = "harness-hook"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "harness-hook: the agent hook entry point with every consumer in-process"

[lib]
name = "harness_hook"
path = "src/lib.rs"

[[bin]]
name = "harness-hook"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
hex.workspace = true
obs-cli = { path = "../obs-cli" }
obs-common.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hmac = "0.12"
ureq.workspace = true
uuid.workspace = true


# Windows-only APIs (process ancestry for the orb, notification state); Linux builds use fallbacks
# so the test suite runs in the Docker builder. File locks use std::fs::File::lock (LockFileEx on Windows).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
