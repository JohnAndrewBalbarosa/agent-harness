[package]
name = "harness-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "harness-services: background services (ensure, OTLP usage receiver, console monitor, Herdr subscriber, spool drain)"

[lib]
name = "harness_services"
path = "src/lib.rs"

[[bin]]
name = "harness-services"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
hex.workspace = true
harness-hook = { path = "../harness-hook" }
obs-cli = { path = "../obs-cli" }
obs-common.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Exclusive bind of the OTLP port (SO_EXCLUSIVEADDRUSE on Windows, like the Python receiver).
socket2 = "0.6"
# Receiver hardening: request timeout and concurrency cap.
tower = { version = "0.5", default-features = false, features = ["limit"] }
tower-http = { version = "0.6", default-features = false, features = ["timeout"] }
tokio = { workspace = true, features = ["io-util"] }
ureq.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
